<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博乐市FuTure酒吧 扫码时间趋势</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; padding: 32px 40px; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; color: #ffffff; }
.subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }
.summary { display: flex; gap: 16px; margin-bottom: 28px; }
.card { flex: 1; background: #16213e; border-radius: 10px; padding: 18px 20px; }
.card .num { font-size: 30px; font-weight: 700; margin-bottom: 2px; }
.card .label { font-size: 12px; color: #888; }
.c1 { color: #ff6b6b; } .c2 { color: #ffa500; } .c3 { color: #4ecdc4; } .c4 { color: #74b9ff; }
.chart-wrap { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 18px; }
</style>
</head>
<body>
<h1>博乐市FuTure酒吧 · 扫码时间趋势</h1>
<p class="subtitle">门店 MD2309002442 ｜ 2025.06 ~ 2026.05 ｜ 11,004 次扫码 ｜ 24 个活跃日 ｜ 中位间隔 14 天</p>

<div class="summary">
  <div class="card"><div class="num c1">24天</div><div class="label">12个月内仅24天有扫码</div></div>
  <div class="card"><div class="num c2">82天</div><div class="label">最长沉寂期（02/26→05/19）</div></div>
  <div class="card"><div class="num c3">300-1,666</div><div class="label">每次爆发扫码量级</div></div>
  <div class="card"><div class="num c4">1-2小时</div><div class="label">每次扫码持续窗口</div></div>
</div>

<div class="chart-wrap"><div id="c1" style="width:100%; height:480px;"></div></div>
<div class="chart-wrap"><div id="c2" style="width:100%; height:360px;"></div></div>

<script>
const raw = [
  ["2025-06-27",42,"23:00"],["2025-06-28",432,"01:00-02:00"],["2025-06-29",263,"01:00-02:00"],
  ["2025-07-31",525,"18:00-20:00"],["2025-08-01",351,"00:00-01:00"],["2025-08-04",1,"19:00"],
  ["2025-08-26",933,"14:00-18:00"],["2025-09-23",701,"22:00-23:00"],["2025-09-24",269,"00:00-01:00"],
  ["2025-10-12",65,"23:00"],["2025-10-13",822,"00:00-01:00"],["2025-11-05",220,"21:00-22:00"],
  ["2025-11-07",221,"01:00"],["2025-11-08",92,"22:00"],["2025-11-27",564,"16:00-18:00"],
  ["2025-12-19",574,"21:00-22:00"],["2025-12-20",628,"00:00-01:00"],["2026-01-20",505,"23:00"],
  ["2026-01-21",32,"00:00"],["2026-01-24",380,"22:00-23:00"],["2026-01-25",195,"00:00"],
  ["2026-02-26",1256,"00:00-02:00"],["2026-05-19",267,"23:00"],["2026-05-24",1666,"00:00 / 16:00-17:00"]
];

// Chart 1: 时间趋势
var c1 = echarts.init(document.getElementById('c1'));
c1.setOption({
  tooltip: {
    trigger: 'axis',
    backgroundColor: 'rgba(22,33,62,0.95)',
    borderColor: '#333',
    textStyle: { color: '#e0e0e0', fontSize: 13 },
    formatter: function(p) {
      var d = raw[p[0].dataIndex];
      return `<b>${d[0]}</b><br/>扫码量 <b style="color:#ff6b6b;font-size:16px">${d[1].toLocaleString()}</b> 次<br/>时间窗口 <span style="color:#aaa">${d[2]}</span>`;
    }
  },
  grid: { left: 60, right: 30, top: 20, bottom: 60 },
  xAxis: {
    type: 'time',
    min: '2025-06-15',
    max: '2026-06-01',
    axisLine: { lineStyle: { color: '#444' } },
    axisLabel: { color: '#999', fontSize: 11,
      formatter: function(v) {
        var d = new Date(v);
        var m = d.getMonth()+1;
        return d.getFullYear()+'-'+(m<10?'0'+m:m);
      }
    },
    splitLine: { show: false },
  },
  yAxis: {
    type: 'value',
    name: '扫码量（箱）',
    nameTextStyle: { color: '#888', fontSize: 12 },
    axisLabel: { color: '#999' },
    splitLine: { lineStyle: { color: '#222', type: 'dashed' } },
  },
  dataZoom: [{ type: 'slider', bottom: 10, height: 20, borderColor: '#333', backgroundColor: '#0f0f23', dataBackground: { lineStyle: { color: '#444' }, areaStyle: { color: '#1a1a3e' } }, selectedDataBackground: { lineStyle: { color: '#ff6b6b' }, areaStyle: { color: 'rgba(255,107,107,0.15)' } }, fillerColor: 'rgba(255,107,107,0.08)', textStyle: { color: '#888' } }],
  series: [{
    type: 'bar',
    data: raw.map(function(d) { return [d[0], d[1]]; }),
    barMaxWidth: 10,
    itemStyle: {
      borderRadius: [5,5,0,0],
      color: new echarts.graphic.LinearGradient(0,0,0,1,[
        { offset: 0, color: '#ff6b6b' },
        { offset: 1, color: '#c0392b' },
      ]),
    },
    emphasis: {
      itemStyle: { color: '#fff' },
    },
    markArea: {
      silent: true,
      data: [
        [{ xAxis: '2025-06-29', itemStyle: { color: 'rgba(255,165,0,0.06)' } }, { xAxis: '2025-07-31' }],
        [{ xAxis: '2025-08-04', itemStyle: { color: 'rgba(255,165,0,0.06)' } }, { xAxis: '2025-08-26' }],
        [{ xAxis: '2025-08-26', itemStyle: { color: 'rgba(255,165,0,0.06)' } }, { xAxis: '2025-09-23' }],
        [{ xAxis: '2025-12-20', itemStyle: { color: 'rgba(255,165,0,0.06)' } }, { xAxis: '2026-01-20' }],
        [{ xAxis: '2026-01-25', itemStyle: { color: 'rgba(255,165,0,0.06)' } }, { xAxis: '2026-02-26' }],
        [{ xAxis: '2026-02-26', itemStyle: { color: 'rgba(239,68,68,0.12)' } }, { xAxis: '2026-05-19' }],
      ],
      label: {
        show: true,
        position: 'insideTop',
        color: '#ffa500',
        fontSize: 10,
        formatter: '{b}',
      },
    },
  }],
});

// Chart 2: 24小时分布 - 按日期展开
// Merge consecutive days into cluster groups
var clusters = [
  ["6/27-29", [42,432,263]],
  ["7/31-8/4", [525,351,1]],
  ["8/26", [933]],
  ["9/23-24", [701,269]],
  ["10/12-13", [65,822]],
  ["11/5-8", [220,221,92]],
  ["11/27", [564]],
  ["12/19-20", [574,628]],
  ["1/20-25", [505,32,380,195]],
  ["2/26", [1256]],
  ["5/19", [267]],
  ["5/24", [1666]],
];

var c2 = echarts.init(document.getElementById('c2'));
c2.setOption({
  title: {
    text: '每次扫码的窗口时长（小时）',
    textStyle: { color: '#ccc', fontSize: 14, fontWeight: 500 },
    left: 'center',
  },
  tooltip: {
    trigger: 'axis',
    backgroundColor: 'rgba(22,33,62,0.95)',
    borderColor: '#333',
    textStyle: { color: '#e0e0e0' },
    formatter: function(p) {
      var idx = p[0].dataIndex;
      return '<b>' + clusters[idx][0] + '</b><br/>累计扫码 <b>' + p[0].value.toLocaleString() + '</b> 次';
    }
  },
  grid: { left: 55, right: 40, top: 50, bottom: 50 },
  xAxis: {
    type: 'category',
    data: clusters.map(function(c) { return c[0]; }),
    axisLabel: { color: '#999', fontSize: 11 },
    axisLine: { lineStyle: { color: '#444' } },
    axisTick: { show: false },
  },
  yAxis: {
    type: 'value',
    name: '扫码量',
    nameTextStyle: { color: '#888', fontSize: 12 },
    axisLabel: { color: '#999' },
    splitLine: { lineStyle: { color: '#222', type: 'dashed' } },
  },
  series: [{
    type: 'bar',
    data: clusters.map(function(c) { return c[1].reduce(function(a,b) { return a+b; }, 0); }),
    barWidth: '35%',
    itemStyle: {
      borderRadius: [6,6,0,0],
      color: function(p) {
        return p.value > 1000
          ? new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#ff6b6b'},{offset:1,color:'#c0392b'}])
          : new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#74b9ff'},{offset:1,color:'#0984e3'}]);
      },
    },
    label: {
      show: true,
      position: 'top',
      color: '#ccc',
      fontSize: 11,
      fontWeight: 600,
      formatter: function(p) { return p.value >= 1000 ? p.value.toLocaleString() : ''; },
    },
  }],
});

window.addEventListener('resize', function() { c1.resize(); c2.resize(); });
</script>
</body>
</html>
